# ~/n8n-docker/docker-compose.yml
version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678" # ← CRITICAL: Add this line!
    environment:
      # Use HTTP for local development
      - N8N_PROTOCOL=http
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - WEBHOOK_URL=http://localhost:5678
      - N8N_SECURE_COOKIE=false # ← Set to false for HTTP
      - N8N_BASIC_AUTH_ACTIVE=false # Disable auth for easy access
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
